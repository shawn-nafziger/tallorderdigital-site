<style>
body{margin:0;background:#f3f4ef;color:#201914;font:400 17px/1.6 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;padding:0 16px}

@media (prefers-color-scheme:dark){html:not([data-theme=light]) nav a:hover{color:#f99a2b}}
html[data-theme=dark] nav a:hover{color:#f99a2b}

  <h1>Air ball.</h1>

</main>
<script>window.goatcounter = { path: function (p) { return "404" + p; } };</script>
<!-- Analytics (both cookie-free): GoatCounter counts visits and reader actions; Cloudflare Web Analytics measures page speed. Same block on every page. -->
<script data-goatcounter="https://tallorderdigital.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "5d3a617ba3ea4ca68113ec25a9a48b1b"}'></script>
<script>
(function () {
  // Reader actions sent to GoatCounter as events, at most once per page view each:
  //   glossary/<page>/<term>  a glossary pop-up was opened
  //   read-to-end/<page>      the reader scrolled down to the footer
  var parts = location.pathname.split("/").filter(Boolean);
  var page = parts.length ? parts[parts.length - 1].replace(/\.html$/, "") : "home";
  var sent = {};
  function send(path, tries) {
    if (sent[path] && tries === undefined) return;
    sent[path] = true;
    var gc = window.goatcounter;
    if (gc && gc.count) { gc.count({ path: path, title: path, event: true }); return; }
    if ((tries || 0) < 20) setTimeout(function () { send(path, (tries || 0) + 1); }, 500);
  }
  // A glossary pop-up counts once it has stayed open for 0.6 s (tap, click, keyboard or hover), so passing the mouse over a term doesn't count.
  if ("MutationObserver" in window) {
    new MutationObserver(function (ms) {
      ms.forEach(function (m) {
        var t = m.target;
        if (t.getAttribute("aria-expanded") !== "true" || !t.getAttribute("data-term")) return;
        setTimeout(function () {
          if (t.getAttribute("aria-expanded") === "true") send("glossary/" + page + "/" + t.getAttribute("data-term"));
        }, 600);
      });
    }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ["aria-expanded"] });
  }
  window.addEventListener("load", function () {
    var foot = document.querySelector("footer");
    // Only long pages (stories): on short pages the footer is visible without scrolling.
    if (!foot || !("IntersectionObserver" in window) ||
        document.documentElement.scrollHeight < 2 * window.innerHeight) return;
    var io = new IntersectionObserver(function (es) {
      if (es.some(function (x) { return x.isIntersecting; })) { send("read-to-end/" + page); io.disconnect(); }
    });
    io.observe(foot);
  });
})();
</script>
</body>
