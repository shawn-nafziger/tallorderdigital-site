name: Publish site

# Publishes tallorderdigital.com with GitHub Pages (Nov 10, 2026; before this, Pages
# published the main branch directly). Same files as before, plus the Weather Almanac:
# it is built every day in shawn-nafziger/weather-live, which pushes the pages to its
# almanac-build branch and then asks this workflow to run (repository_dispatch
# "almanac-updated"). This workflow copies that branch into weather/almanac/, so the
# Almanac is an ordinary folder of the site: same hosting, same certificate.
#
# Runs on every push to main (PR merges and the morning dashboard commits), when
# the Almanac is rebuilt, and by hand. If any step fails, nothing is published and
# the site stays exactly as it was.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [almanac-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # to find this run's uploaded site (the fallback deploy below)

# One publish at a time; a newer one waits rather than cancelling an older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_api.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2     # so the IndexNow step can see which pages this push changed

      - name: Note what changed, for IndexNow
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            git diff --name-only HEAD~1 HEAD > "$RUNNER_TEMP/changed.txt" || : > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          curl -fsS https://tallorderdigital.com/weather/almanac/sitemap.xml -o "$RUNNER_TEMP/prev-almanac.xml" \
            || : > "$RUNNER_TEMP/prev-almanac.xml"

      - name: Add the Weather Almanac
        run: |
          if [ -e weather/almanac ]; then
            echo "::error::weather/almanac/ must not exist in this repo; it comes from weather-live."; exit 1
          fi
          git clone -q --depth 1 --branch almanac-build https://github.com/shawn-nafziger/weather-live.git weather/almanac
          rm -rf weather/almanac/.git
          # A missing or half-built Almanac stops the publish; the live site keeps the last good one.
          test -f weather/almanac/index.html
          test -f weather/almanac/sitemap.xml
          echo "Almanac: $(find weather/almanac -name index.html | wc -l) pages"

      - name: Leave out the repo's own files
        run: rm -rf .git .github

      - uses: actions/configure-pages@v5

      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # The usual deploy. Since Nov 24, 2026, GitHub's deploy-pages sometimes can't find the site that was just
      # uploaded ('No artifacts named "github-pages" were found', a known GitHub bug; the upload itself is fine),
      # so a failure here doesn't stop the run: the next step deploys the same upload another way.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Fallback: hand the upload's ID straight to GitHub's Pages deployment API (the same call deploy-pages makes
      # once it has found the upload), then wait until the site is live. Runs only if the usual deploy failed;
      # fails the run if this doesn't work either, so nothing is reported as published when it isn't.
      - id: deploy_api
        name: Deploy (fallback, if the usual deploy failed)
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACT_ID:-}" ]; then
            ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | last | .id')
          fi
          echo "Deploying upload $ARTIFACT_ID"
          OIDC=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          RESP=$(gh api -X POST "repos/$REPO/pages/deployments" \
            -F artifact_id="$ARTIFACT_ID" -f pages_build_version="$GITHUB_SHA" \
            -f environment=github-pages -f oidc_token="$OIDC")
          DEP=$(echo "$RESP" | jq -r '.id'); URL=$(echo "$RESP" | jq -r '.page_url')
          echo "Deployment $DEP created"
          for i in $(seq 1 60); do
            ST=$(gh api "repos/$REPO/pages/deployments/$DEP" --jq '.status' || echo unknown)
            echo "  status: $ST"
            case "$ST" in
              succeed) echo "page_url=$URL" >> "$GITHUB_OUTPUT"; echo "Published."; exit 0 ;;
              deployment_failed|deployment_lost|deployment_cancelled|deployment_content_failed|deployment_attempt_error)
                echo "::error::Pages deployment $DEP ended with status $ST"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Pages deployment $DEP didn't finish within 10 minutes"; exit 1

      # Tell Bing and the other IndexNow engines which pages just changed (tools/indexnow.js). Never fails the run.
      - name: Ping IndexNow
        if: steps.deploy.outcome == 'success' || steps.deploy_api.outcome == 'success'
        continue-on-error: true
        run: node tools/indexnow.js --changed "$RUNNER_TEMP/changed.txt" --prev-almanac "$RUNNER_TEMP/prev-almanac.xml"
